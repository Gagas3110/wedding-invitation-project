[phases.setup]
aptPkgs = [
    "...",
    "chromium",
    "libglib2.0-0",
    "libnss3",
    "libatk-bridge2.0-0",
    "libx11-xcb1",
    "libxcb-dri3-0",
    "libdrm2",
    "libgbm1",
    "libasound2",
    "libatspi2.0-0",
    "libcups2",
    "libdbus-1-3",
    "libgdk-pixbuf2.0-0",
    "libnspr4",
    "libpango-1.0-0",
    "libxcomposite1",
    "libxdamage1",
    "libxfixes3",
    "libxrandr2",
    "libgbm-dev",
    "xdg-utils"
